global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'indecisive-wear-monitoring'

scrape_configs:
  # Medusa Backend Metrics
  - job_name: 'medusa-backend'
    static_configs:
      - targets: ['test-medusa:9000']
    metrics_path: '/monitoring'
    scrape_interval: 10s
    scrape_timeout: 5s
    
  # PostgreSQL Exporter (if configured)
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
    
  # Redis Exporter (if configured)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    
  # Node Exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    
  # Docker metrics
  - job_name: 'docker'
    static_configs:
      - targets: ['docker-host:9323']

# Alerting rules
rule_files:
  - '/etc/prometheus/alerts/*.yml'

# Alert manager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']