version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medusa-postgres
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medusa-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medusa-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://medusa:medusa@postgres:5432/medusa_db
      REDIS_URL: redis://redis:6379?family=0
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-change-in-production}
      COOKIE_SECRET: ${COOKIE_SECRET:-your-cookie-secret-change-in-production}
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      ADMIN_CORS: http://localhost:9000,http://localhost:3000
      STORE_CORS: http://localhost:3000,http://localhost:9000
      AUTH_CORS: http://localhost:9000
      PORT: 9000
      MEDUSA_ADMIN_ONBOARDING_TYPE: default
      MEDUSA_ADMIN_BACKEND_URL: http://localhost:9000
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    ports:
      - "9000:9000"
    command: sh -c "yarn medusa db:migrate && yarn start"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medusa-worker
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://medusa:medusa@postgres:5432/medusa_db
      REDIS_URL: redis://redis:6379?family=0
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-change-in-production}
      COOKIE_SECRET: ${COOKIE_SECRET:-your-cookie-secret-change-in-production}
      MEDUSA_WORKER_MODE: worker
      DISABLE_MEDUSA_ADMIN: true
    volumes:
      - ./backend:/app
    command: yarn start --worker-mode

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medusa-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: medusa-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  backend_uploads: